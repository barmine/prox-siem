services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: proxsiem-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      # Bound to localhost only: the ingestion API is the only intended
      # client and runs on this same VM. Security plugin is disabled since
      # this never leaves loopback.
      - "127.0.0.1:9200:9200"
    restart: unless-stopped

volumes:
  opensearch-data:
