services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: proxsiem-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      # Phase 3: the proxmox-logs-rules ingest pipeline (generated from
      # rules.yaml -- see opensearch/generate_rules_pipeline.py) matches
      # raw-log docs with dynamic regex patterns via Painless. This is a
      # static/node-level setting -- it can't be flipped with the cluster
      # settings API, only here + a container recreate.
      - script.painless.regex.enabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      # 127.0.0.1: the local ingestion API (Phase 1).
      # LAN IP: Fluent Bit on the PVE node + local PBS instance (Phase 2).
      # Security plugin stays disabled (no auth) -- access is restricted at
      # the network layer instead (see docs/log-shipping-setup.md and the
      # ufw rules applied on this host). Not bound to 0.0.0.0.
      #
      # Remote VPS PBS over Tailscale is deferred -- when picked back up,
      # add "<tailscale-ip>:9200:9200" here once this VM has joined the
      # tailnet (don't guess the IP; get it from `tailscale ip -4`).
      - "127.0.0.1:9200:9200"
      - "192.168.50.248:9200:9200"
    restart: unless-stopped

volumes:
  opensearch-data:
