[SERVICE]
    Flush           5
    Daemon          Off
    Log_Level       info
    Parsers_File    /etc/fluent-bit/parsers.conf
    storage.path    /var/lib/fluent-bit/storage
    storage.sync    normal

# Phase 4: pipeline-health heartbeat. Written into the same proxmox-logs-*
# index as everything else (source_type: heartbeat), so Pipeline Health
# can answer "is this host's Fluent Bit alive and reaching OpenSearch"
# directly, instead of inferring liveness from whatever else happens to be
# quiet or chatty on that host. Explore hides source_type:heartbeat by
# default (still queryable if you explicitly filter for it).
[INPUT]
    Name            dummy
    Tag             heartbeat
    Dummy           {"message": "heartbeat"}
    Interval_Sec    60

[FILTER]
    Name    modify
    Match   heartbeat
    Add     severity     info
    Add     title        ""
    Add     hostname     ${FB_HOSTNAME}
    Add     unit         heartbeat
    Add     source_type  heartbeat
