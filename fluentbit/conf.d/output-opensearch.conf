# Writes every event into the same proxmox-logs-* daily-index pattern
# Phase 1's ingestion API already uses, so the dashboard and ISM policy
# apply uniformly regardless of which pipeline wrote a document.
#
# SIEM_OPENSEARCH_HOST / SIEM_OPENSEARCH_PORT come from /etc/default/fluent-bit
# (see fluentbit/env.example). No auth: OpenSearch's security plugin is
# disabled here, same as Phase 1 -- this pipeline relies on network-level
# restriction (see docs/log-shipping-setup.md) rather than credentials.
[OUTPUT]
    Name              opensearch
    Match             *
    Host              ${SIEM_OPENSEARCH_HOST}
    Port              ${SIEM_OPENSEARCH_PORT}
    Index             proxmox-logs
    Logstash_Format   On
    Logstash_Prefix   proxmox-logs
    Logstash_DateFormat %Y.%m.%d
    Time_Key          timestamp
    # NOT %Y-%m-%dT%H:%M:%S.%LZ -- %L isn't substituted by this plugin, so it
    # was being left in literally, then Fluent Bit appended its own real
    # fractional-seconds+Z anyway, producing invalid values like
    # "2026-09-08T20:21:38.%LZ.134Z" that OpenSearch's strict date parser
    # rejected outright (confirmed via a live tcpdump of the bulk response
    # during Phase 2 rollout). Fluent Bit appends .mmmZ on its own when
    # Logstash_Format is On -- just stop at seconds here.
    Time_Key_Format   %Y-%m-%dT%H:%M:%S
    Suppress_Type_Name On
    Include_Tag_Key    On
    Tag_Key             _fb_tag
    tls                Off
    Retry_Limit        5
