# PVE role: journal units, task-log index, pveproxy access log.
#
# NOTE on sshd: Proxmox VE is Debian-based, so the systemd unit is normally
# `ssh.service` (not `sshd.service`, which is the RHEL-style name). Verify
# with `systemctl status ssh` on the real node -- if it's different, fix the
# _SYSTEMD_UNIT line below.
#
# NOTE on the firewall unit: both `proxmox-firewall` (PVE 9+) and
# `pve-firewall` (older) are included below so this works either way;
# whichever doesn't exist on your version just never matches, harmlessly.

[INPUT]
    Name            systemd
    Tag             pve.journal
    # Or (not the default And) -- otherwise these Systemd_Filter lines would
    # require ALL units to match simultaneously, which no single journal
    # entry can ever do.
    Systemd_Filter_Type Or
    Systemd_Filter  _SYSTEMD_UNIT=pveproxy.service
    Systemd_Filter  _SYSTEMD_UNIT=pvedaemon.service
    Systemd_Filter  _SYSTEMD_UNIT=pvestatd.service
    Systemd_Filter  _SYSTEMD_UNIT=pvescheduler.service
    Systemd_Filter  _SYSTEMD_UNIT=pve-ha-lrm.service
    Systemd_Filter  _SYSTEMD_UNIT=pve-ha-crm.service
    Systemd_Filter  _SYSTEMD_UNIT=pve-cluster.service
    Systemd_Filter  _SYSTEMD_UNIT=corosync.service
    Systemd_Filter  _SYSTEMD_UNIT=proxmox-firewall.service
    Systemd_Filter  _SYSTEMD_UNIT=pve-firewall.service
    Systemd_Filter  _SYSTEMD_UNIT=ssh.service
    Read_From_Tail  On
    Strip_Underscores Off

# Kernel messages come from the journal's kernel transport, not a unit --
# they need their own input since Systemd_Filter lines on different field
# names AND together (see docs/log-shipping-setup.md for why).
[INPUT]
    Name            systemd
    Tag             pve.journal
    Systemd_Filter  _TRANSPORT=kernel
    Read_From_Tail  On
    Strip_Underscores Off

[INPUT]
    Name            tail
    Tag             pve.tasklog
    Path            /var/log/pve/tasks/index
    Parser          pve_task_index
    DB              /var/lib/fluent-bit/pve-tasks-index.db
    Read_from_Head  Off
    Skip_Long_Lines On

[INPUT]
    Name            tail
    Tag             pve.accesslog
    Path            /var/log/pveproxy/access.log
    Parser          pve_access_log
    DB              /var/lib/fluent-bit/pve-access.db
    Read_from_Head  Off
    Skip_Long_Lines On

[FILTER]
    Name    modify
    Match   pve.tasklog
    Add     hostname ${FB_HOSTNAME}

[FILTER]
    Name    modify
    Match   pve.accesslog
    Add     hostname ${FB_HOSTNAME}

[FILTER]
    Name    lua
    Match   pve.journal
    script  /etc/fluent-bit/filters.lua
    call    journal_to_event

[FILTER]
    Name    lua
    Match   pve.tasklog
    script  /etc/fluent-bit/filters.lua
    call    task_index_to_event

[FILTER]
    Name    lua
    Match   pve.accesslog
    script  /etc/fluent-bit/filters.lua
    call    access_log_to_event
