# PBS role: journal units + task log. Used for both the local PBS instance
# and the remote VPS PBS instance -- only /etc/default/fluent-bit
# (SIEM_OPENSEARCH_HOST) differs between them.
#
# NOTE on sshd: same caveat as the PVE config -- verify the real unit name
# with `systemctl status ssh` on the actual PBS host.

[INPUT]
    Name            systemd
    Tag             pbs.journal
    Systemd_Filter_Type Or
    Systemd_Filter  _SYSTEMD_UNIT=proxmox-backup-proxy.service
    Systemd_Filter  _SYSTEMD_UNIT=proxmox-backup.service
    Systemd_Filter  _SYSTEMD_UNIT=ssh.service
    Read_From_Tail  On
    Strip_Underscores Off

[INPUT]
    Name            systemd
    Tag             pbs.journal
    Systemd_Filter  _TRANSPORT=kernel
    Read_From_Tail  On
    Strip_Underscores Off

[INPUT]
    Name            tail
    Tag             pbs.tasklog
    Path            /var/log/proxmox-backup/tasks/active
    Parser          pbs_task_active
    DB              /var/lib/fluent-bit/pbs-tasks-active.db
    Read_from_Head  Off
    Skip_Long_Lines On

[FILTER]
    Name    modify
    Match   pbs.tasklog
    Add     hostname ${FB_HOSTNAME}

[FILTER]
    Name    lua
    Match   pbs.journal
    script  /etc/fluent-bit/filters.lua
    call    journal_to_event

[FILTER]
    Name    lua
    Match   pbs.tasklog
    script  /etc/fluent-bit/filters.lua
    call    task_index_to_event
