# Installed by install.sh as
# /etc/systemd/system/fluent-bit.service.d/override.conf
#
# Layers on top of the stock unit shipped by the fluent-bit apt package
# instead of replacing it, so package upgrades don't clobber our config.
# %H expands to the machine's hostname at service start -- used by the
# `modify` filters in input-pve.conf/input-pbs.conf for sources (task logs,
# access logs) that don't carry a hostname field of their own the way
# journal entries do.
[Service]
EnvironmentFile=/etc/default/fluent-bit
Environment=FB_HOSTNAME=%H
