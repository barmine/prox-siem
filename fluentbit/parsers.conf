# Custom parsers for Proxmox raw-file log sources. Journal sources (PVE/PBS
# daemons, sshd, kernel) don't need a parser here -- Fluent Bit's `systemd`
# input already returns structured journald fields (MESSAGE, PRIORITY,
# _SYSTEMD_UNIT, _HOSTNAME, ...); see filters.lua for how those get reshaped.
#
# CONFIDENCE NOTE: pve_access_log's overall CLF structure (ip/user/method/
# path/status/size) is now confirmed against a live PVE host -- only its
# date sub-format was wrong (fixed below). pve_task_index and
# pbs_task_active are still built purely from Proxmox's documented UPID
# format and have NOT been verified against a live host. Before trusting
# them, tail the real file on the real host and compare a line against the
# regex -- see docs/log-shipping-setup.md "Verify parsers before trusting
# them".

[PARSER]
    Name        pve_task_index
    Format      regex
    # UPID:<node>:<pid>:<pstart>:<starttime>:<type>:<id>:<user>: <endtime> <status...>
    Regex       ^(?<upid>UPID:(?<node>[^:]+):(?<pid>[0-9A-Fa-f]+):(?<pstart>[0-9A-Fa-f]+):(?<starttime>[0-9A-Fa-f]+):(?<worker_type>[^:]+):(?<worker_id>[^:]*):(?<user>[^:]+):) (?<endtime>\d+) (?<status>.+)$

[PARSER]
    Name        pbs_task_active
    Format      regex
    # Same UPID convention as PVE; PBS's exact active-task-log line format
    # is the least-verified part of this config -- check it on a real host.
    Regex       ^(?<upid>UPID:(?<node>[^:]+):(?<pid>[0-9A-Fa-f]+):(?<pstart>[0-9A-Fa-f]+):(?<starttime>[0-9A-Fa-f]+):(?<worker_type>[^:]+):(?<worker_id>[^:]*):(?<user>[^:]+):) (?<endtime>\d+) (?<status>.+)$

[PARSER]
    Name        pve_access_log
    Format      regex
    # pveproxy's access log is CLF-shaped but NOT true Apache CLF: the date
    # uses a numeric month (08/09/2026), not the %b month abbreviation Apache
    # uses (08/Sep/2026). Confirmed against a live host's log during Phase 2
    # rollout -- the original %b assumption failed to parse every line.
    # <ip> - <user> [dd/mm/YYYY:HH:MM:SS +ZZZZ] "<method> <path> <proto>" <status> <size>
    Regex       ^(?<remote_ip>[^ ]+) [^ ]+ (?<user>[^ ]+) \[(?<time>[^\]]+)\] "(?<method>[A-Z]+) (?<path>[^ ]+)(?: [^"]*)?" (?<status>[0-9]+) (?<size>[0-9-]+)(?: "(?<referer>[^"]*)" "(?<agent>[^"]*)")?$
    Time_Key    time
    Time_Format %d/%m/%Y:%H:%M:%S %z
