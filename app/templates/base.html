<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>prox-siem{% block title_suffix %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="shell">

    <nav class="nav-edge">
      <a class="wordmark" href="{{ url_for('dashboard.overview') }}">prox&middot;siem</a>
      <span class="status"><span class="status__dot" aria-hidden="true"></span>live</span>
    </nav>

    <nav class="view-tabs" aria-label="Switch view">
      <a class="view-tab {{ 'is-active' if active_view == 'overview' else '' }}" href="{{ url_for('dashboard.overview') }}">overview</a>
      <a class="view-tab {{ 'is-active' if active_view == 'explore' else '' }}" href="{{ url_for('dashboard.explore') }}">explore</a>
      <a class="view-tab {{ 'is-active' if active_view == 'pipeline_health' else '' }}" href="{{ url_for('pipeline_health.index') }}">pipeline health</a>
      <a class="view-tab {{ 'is-active' if active_view == 'mutes' else '' }}" href="{{ url_for('mutes.index') }}">mutes</a>
    </nav>

    {% block content %}{% endblock %}

    <footer class="foot-stmt">
      <p class="foot-stmt__line">Every row here happened. Nothing here is a drill.</p>
      <div class="foot-stmt__meta">
        <span>prox&middot;siem</span>
        <span>opensearch &middot; internal network only</span>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      var el = document.getElementById("stat-figure");
      if (!el) return;
      var target = parseInt(el.dataset.target, 10) || 0;
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var fmt = new Intl.NumberFormat();

      if (reduceMotion || target === 0) {
        el.textContent = fmt.format(target);
        return;
      }

      var start = null;
      var duration = 400;

      function tick(ts) {
        if (start === null) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = fmt.format(Math.round(eased * target));
        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          el.textContent = fmt.format(target);
        }
      }
      requestAnimationFrame(tick);
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
